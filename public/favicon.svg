<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="flShieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="50%" stop-color="#004b91" />
      <stop offset="100%" stop-color="#0066c0" />
    </linearGradient>
    <linearGradient id="flAccentGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff8c00" />
      <stop offset="60%" stop-color="#ef6c00" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <linearGradient id="flCoreGrad" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Body -->
  <path
    d="M24 3.5C24 3.5 35.5 6.5 41 8C41.5 16.5 42 27.5 24 44.5C6 27.5 6.5 16.5 7 8C12.5 6.5 24 3.5 24 3.5Z"
    fill="url(#flShieldGrad)"
    stroke="url(#flAccentGrad)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Top Gloss Reflect -->
  <path
    d="M24 5.5L39 9.5C39.4 15.5 39.8 23 33.5 32.5L24 23.5V5.5Z"
    fill="#ffffff"
    fill-opacity="0.12"
  />

  <!-- Center Protected Document & Pillar Symbol -->
  <rect
    x="16.5"
    y="15.5"
    width="15"
    height="18"
    rx="2"
    fill="none"
    stroke="url(#flCoreGrad)"
    stroke-width="2"
  />

  <line x1="20" y1="20" x2="28" y2="20" stroke="url(#flCoreGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="20" y1="24.5" x2="28" y2="24.5" stroke="url(#flCoreGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Checkmark -->
  <path
    d="M17.5 26.5L22.5 31.5L32.5 19.5"
    fill="none"
    stroke="url(#flAccentGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M17.5 26.5L22.5 31.5L32.5 19.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
